version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: budgeting_app
      MYSQL_ROOT_PASSWORD: REDACTED_ROOT_PASSWORD
      MYSQL_USER: user
      MYSQL_PASSWORD: REDACTED_PASSWORD
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=5050
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=REDACTED_PASSWORD
      - DB_NAME=budgeting_app
      - CLIENT_URL=http://localhost
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
