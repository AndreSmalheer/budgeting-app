version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=5050
      - DB_HOST=REDACTED_HOST
      - DB_PORT=3306
      - DB_USER=REDACTED_USER
      - DB_PASSWORD=REDACTED_PASSWORD
      - DB_NAME=budgeting_app
      - CLIENT_URL=http://localhost

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
